<!doctype html>
<html lang="nl">

<head>
    <base href="../">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Magical Winter Banquet | Sorting Hat</title>
    <link rel="icon" href="./favicon.ico">
    <link rel="stylesheet" href="./css/main.css">
    <script src="./js/reveal-sequence.js" defer></script>
    <script src="./js/smooth-scroll.js" defer></script>
    <script src="./js/background-audio.js" defer></script>
    <script type="module" src="./js/sorting.js"></script>
</head>

<body class="relative min-h-screen overflow-x-hidden bg-neutral-950 font-serif text-amber-50 antialiased" data-asset-base-path="../">
    <audio id="background-audio" preload="auto" loop autoplay>
        <source src="./assets/music/platform-nine-and-three-quarters.mp3" type="audio/mp3">
    </audio>
    <audio id="background-audio-2" preload="auto">
        <source src="./assets/music/sorting-hat-welcome.mp3" type="audio/mp3">
    </audio>

    <div aria-hidden="true"
        class="burnt-paper-bg pointer-events-none absolute inset-0 z-0 origin-center bg-[url('../assets/images/the-great-hall.png')] bg-cover bg-center bg-no-repeat opacity-100 animate-[backgroundZoom_1.8s_ease-out_forwards]">
    </div>
    <div aria-hidden="true"
        class="pointer-events-none absolute inset-0 z-[1] bg-gradient-to-b from-transparent via-black/70 to-black opacity-0 animate-[fadeInOverlay_1.8s_ease-out_forwards]">
    </div>

    <main class="relative z-10 flex min-h-screen items-center justify-center px-4 py-8 sm:px-6 sm:py-10">
        <section
            class="relative z-10 w-full max-w-2xl opacity-0 animate-[revealFade_0.8s_ease-out_forwards] [animation-delay:1.8s]">
            <div class="p-5 sm:p-8">
                <div class="text-center opacity-0 animate-[revealFade_0.8s_ease-out_forwards] [animation-delay:1.2s]">
                    <img id="sorting-hat-image" src="./assets/images/sorting-hat-talking-1.png" alt="Sorting Hat"
                        class="mx-auto h-40 w-auto drop-shadow-[0_18px_32px_rgba(0,0,0,0.7)] sm:h-52">
                </div>

                <div class="mt-8 space-y-6 text-left text-charcoal">
                    <div class="space-y-2 opacity-0 animate-[revealFade_0.8s_ease-out_forwards] [animation-delay:1.8s]">
                        <h1 id="sorting-progress" class="font-inkpot text-3xl text-amber-50 sm:text-4xl">Loading
                            questions</h1>
                    </div>

                    <p id="sorting-question"
                        class="text-base leading-relaxed text-amber-50/85 opacity-0 animate-[revealFade_0.8s_ease-out_forwards] sm:text-lg [animation-delay:2.1s]">
                        Loading the Sorting Hat questions...
                    </p>

                    <div
                        class="h-[200px] min-h-[200px] max-h-[200px] shrink-0 overflow-y-auto pr-1 [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden">
                        <div id="sorting-options" class="grid gap-3 sm:grid-cols-2"></div>
                    </div>

                    <div id="sorting-result" class="hidden space-y-4 rounded-none px-4 py-5 text-amber-50 opacity-0">
                        <p class="hidden text-[0.65rem] uppercase tracking-[0.34em] text-amber-100/80">Result</p>
                        <h2 id="sorting-house-name" class="font-inkpot text-3xl sm:text-4xl">The Sorting Hat has spoken
                        </h2>
                        <p id="sorting-result-copy"
                            class="hidden text-base leading-relaxed text-amber-50/85 sm:text-lg"></p>
                        <button id="sorting-restart" type="button"
                            class="hidden group flex w-full items-center justify-between rounded-none border px-4 py-3 text-center text-sm text-amber-50 transition-colors duration-200 focus:outline-none focus-visible:outline-none sm:text-base">
                            <span>Try again</span>
                            <span aria-hidden="true"
                                class="text-amber-200/80 transition-transform duration-200 group-hover:translate-x-1">→</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
