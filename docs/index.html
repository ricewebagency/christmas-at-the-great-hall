<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="An invitation to Christmas at the Great Hall, with all event details and RSVP information in one place.">

    <meta name="theme-color" content="#1a120f">
    <meta name="color-scheme" content="dark light">

    <link rel="canonical" href="./">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="./favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Christmas at the Great Hall">
    <meta property="og:title" content="Christmas at the Great Hall | Invitation">
    <meta property="og:description"
        content="An invitation to Christmas at the Great Hall, with all event details and RSVP information in one place.">
    <meta property="og:url" content="./">
    <meta property="og:image" content="./assets/images/the-great-hall.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Christmas at the Great Hall | Invitation">

        content="An invitation to Christmas at the Great Hall, with all event details and RSVP information in one place.">
    <meta name="twitter:image" content="./assets/images/the-great-hall.png">
    <meta name="twitter:image:alt" content="The Great Hall lit by floating candles and a festive feast.">

    <script type="module">
        import { getInvitationData } from './js/api-client.js';

        const redirectToInvite = () => {
            window.location.replace('./invite/');
        };

        const redirectTo404 = () => {
            window.location.replace('./404.html');
        };

        async function redirectFromHome() {
            try {
                const user = await getInvitationData();

                if (user && user.guestName) {
                    redirectToInvite();
                } else {
                    redirectTo404();
                }
            } catch (error) {
                redirectTo404();
            }
        }

        void redirectFromHome();
    </script>
    <script src="./js/background-audio.js" defer></script>
</head>

<body data-asset-base-path="./">
    <audio id="background-audio" preload="auto" loop autoplay muted>
        <source src="./assets/music/diagon_alley.mp3.mpeg" type="audio/mpeg">
    </audio>
</body>
