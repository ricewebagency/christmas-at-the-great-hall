<!doctype html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas at the Great Hall | RSVP</title>
    <link rel="icon" href="./favicon.ico">
    <link rel="stylesheet" href="./css/main.css">
    <script src="./js/reveal-sequence.js" defer></script>
    <script src="./js/smooth-scroll.js" defer></script>
    <script src="./js/background-audio.js" defer></script>
    <script type="module" src="./js/rsvp-form.js"></script>
</head>

<body class="relative min-h-dvh overflow-x-hidden bg-neutral-950 font-serif text-amber-50 antialiased">
    <audio id="background-audio" preload="auto" loop autoplay>
        <source src="./assets/music/hedwigs-song.mp3" type="audio/mp3">
    </audio>
    <div aria-hidden="true"
        class="pointer-events-none absolute inset-0 z-0 bg-[url('../assets/images/burnt-paper.png')] bg-cover bg-center bg-no-repeat opacity-100">
    </div>

    <main class="relative z-10 flex min-h-dvh items-center justify-center px-4 py-8 sm:px-6 sm:py-10">
        <section id="rsvp-root"
            class="relative z-10 w-full max-w-xl p-5 text-charcoal transition duration-700 ease-out motion-reduce:transform-none motion-reduce:transition-none sm:p-8 font-inkpot">
            <p data-reveal style="--reveal-delay: 400ms;"
                class="mt-8 text-left text-xl italic text-charcoal sm:text-2xl">
                Dear Headmistress,
            </p>
            <div class="mt-8 space-y-5 text-left text-sm leading-relaxed tracking-wide text-charcoal/90 sm:text-base">
                <p data-reveal style="--reveal-delay: 1100ms;">
                    Thank you for your letter and invitation to Christmas at the Great Hall on December 24th at 19:00.
                </p>
                <p data-reveal style="--reveal-delay: 1700ms;">
                    Via this letter, I wish to let you know that my choice to attend has been made.
                </p>
                <p data-reveal style="--reveal-delay: 2300ms;">
                    My answer to your invitation is:
                </p>
                <form data-reveal style="--reveal-delay: 2900ms;" class="pt-1 space-y-4">
                    <div class="flex items-center gap-12 pt-1 pl-4 text-left text-lg sm:text-xl">
                        <button type="button" data-attendance-choice="yes"
                            class="attendance-choice appearance-none border-0 bg-transparent p-0 text-charcoal/85 opacity-45 transition-opacity duration-200 hover:opacity-100 focus:outline-none focus-visible:outline-none">
                            Yes
                        </button>
                        <button type="button" data-attendance-choice="no"
                            class="attendance-choice appearance-none border-0 bg-transparent p-0 text-charcoal/85 opacity-45 transition-opacity duration-200 hover:opacity-100 focus:outline-none focus-visible:outline-none">
                            No
                        </button>
                    </div>
                    <input type="hidden" name="attendanceResponse" id="attendance-response" value="">
                    <div class="flex justify-end pt-1 text-left">
                        <button type="submit"
                            class="group inline-flex items-center gap-2 text-sm text-charcoal/85 transition-colors duration-200 hover:text-charcoal focus:outline-none focus-visible:outline-none sm:text-base">
                            <span>Send letter via owl →</span>
                        </button>
                    </div>
                </form>
                <div class="pt-2">
                    <p data-reveal style="--reveal-delay: 3400ms;" class="mt-2 text-base italic text-charcoal">Yours
                        sincerely,</p>
                    <div data-reveal style="--reveal-delay: 3900ms;" class="mt-6">
                        <p class="text-left text-xl italic text-charcoal sm:text-2xl"><span id="guest-name">Guest</span>
                        </p>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
